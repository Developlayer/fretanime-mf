<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fretanime-mf</title>
    <!-- h264-mp4-encoder: WASM版H.264エンコーダー（SharedArrayBuffer不要） -->
    <!-- ライセンス: MIT (h264-mp4-encoder) + Public Domain (minih264) + MPL 1.1 (libmp4v2) -->
    <script src="https://unpkg.com/h264-mp4-encoder@1.0.12/embuild/dist/h264-mp4-encoder.web.js"></script>
    <style>
        /* ===== リセット & 基本スタイル ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;  /* スクロール禁止 */
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* ===== カメラ映像（画面外に配置） ===== */
        /* 注意: display:noneはChromebookで映像処理に問題を起こす可能性があるため、
           画面外に配置して非表示にする */
        #video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* ===== 描画Canvas（フルスクリーン） ===== */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        /* ===== エラーメッセージ ===== */
        #errorMessage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            z-index: 200;
            display: none;
        }

        /* ===== UIオーバーレイ（右上） ===== */
        .ui-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 30px;
            border-radius: 16px;
            z-index: 100;
        }

        /* ===== ボタン共通スタイル ===== */
        button {
            padding: 20px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.2s, transform 0.1s;
            min-width: 88px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: scale(0.95);
        }

        button.active {
            background: #4a90d9;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button:disabled:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ===== 録画中のスタイル ===== */
        button.recording {
            background: #d94a4a;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* ===== フォーカスコントロール ===== */
        .focus-control {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .focus-slider {
            width: 400px;
            height: 12px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            outline: none;
        }

        .focus-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }

        .focus-slider:disabled {
            opacity: 0.4;
        }

        .focus-slider:disabled::-webkit-slider-thumb {
            cursor: not-allowed;
        }

        .focus-value {
            min-width: 110px;
            color: white;
            font-size: 24px;
            text-align: center;
        }

        /* ===== 区切り線 ===== */
        .divider {
            width: 2px;
            height: 48px;
            background: rgba(255, 255, 255, 0.3);
        }

        /* ===== グリッドモードボタン ===== */
        .grid-buttons {
            display: flex;
            gap: 10px;
        }

        /* ===== 再生/録画ボタン ===== */
        .playback-buttons {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <!-- カメラ映像（画面外に配置、Canvasへの描画元） -->
    <video id="video" autoplay playsinline muted width="1280" height="720"></video>

    <!-- 描画Canvas（フルスクリーン） -->
    <canvas id="canvas"></canvas>

    <!-- エラーメッセージ -->
    <div id="errorMessage"></div>

    <!-- UIオーバーレイ（右上） -->
    <div class="ui-container">
        <!-- フォーカスコントロール（新規追加） -->
        <div class="focus-control">
            <button id="focusModeBtn" disabled>AF</button>
            <input type="range" id="focusSlider" class="focus-slider"
                   min="2" max="100" value="50" step="1" disabled>
            <span id="focusValue" class="focus-value">AUTO</span>
        </div>

        <!-- 区切り -->
        <div class="divider"></div>

        <!-- グリッドモードボタン -->
        <div class="grid-buttons">
            <button id="gridBtn" class="active" data-mode="grid" title="田んぼ分割">田</button>
            <button id="columnBtn" data-mode="column" title="タテ短冊">タテ</button>
            <button id="rowBtn" data-mode="row" title="ヨコ短冊">ヨコ</button>
        </div>

        <!-- 区切り -->
        <div class="divider"></div>

        <!-- 再生/録画ボタン -->
        <div class="playback-buttons">
            <button id="playStopBtn" title="再生/停止">▶</button>
            <button id="recordBtn" title="録画">⏺</button>
        </div>
    </div>

    <script>
        // ===== 設定定数 =====
        const CONFIG = {
            // アニメーション設定
            FRAME_INTERVAL_MS: 250,      // 1フレームの表示時間（ミリ秒）
            TOTAL_FRAMES: 4,             // フレーム数

            // カメラ設定
            VIDEO_WIDTH: 1280,
            VIDEO_HEIGHT: 720,

            // フォーカス設定（メートル単位）
            FOCUS_MIN_M: 0.02,           // 2cm
            FOCUS_MAX_M: 1.0,            // 100cm

            // 録画設定
            VIDEO_FPS: 4,
            VIDEO_QUALITY: 26,           // h264-mp4-encoder品質（10-51、低いほど高品質）

            // デバッグモード
            DEBUG: false
        };

        // ===== デバッグログ出力 =====
        function debugLog(...args) {
            if (CONFIG.DEBUG) {
                console.log(...args);
            }
        }

        // ===== 状態管理 =====
        const state = {
            // DOM要素
            elements: {
                video: null,               // video要素
                canvas: null,              // canvas要素
                ctx: null,                 // canvas 2Dコンテキスト
                // UIボタン
                playStopBtn: null,         // 再生/停止ボタン
                recordBtn: null,           // 録画ボタン
                focusModeBtn: null,        // AF/MFボタン
                focusSlider: null,         // フォーカススライダー
                focusValue: null,          // フォーカス値表示
                errorMessage: null         // エラーメッセージ
            },

            // カメラ関連
            camera: {
                track: null,               // カメラのビデオトラック
                focusSupported: false,     // フォーカス制御サポートフラグ
                mfSupported: false,        // マニュアルフォーカスサポートフラグ
                focusMode: 'continuous',   // フォーカスモード: 'continuous' or 'manual'
                focusDistanceMin: CONFIG.FOCUS_MIN_M,  // フォーカス距離の最小値
                focusDistanceMax: CONFIG.FOCUS_MAX_M   // フォーカス距離の最大値
            },

            // アニメーション関連
            animation: {
                isPlaying: false,          // アニメーション再生中フラグ
                currentFrame: 0,           // 現在表示中のフレーム (0-3)
                intervalId: null,          // アニメーションのインターバルID
                wasPausedByVisibility: false  // ページ非表示で一時停止されたか
            },

            // 録画関連
            recording: {
                isRecording: false,        // 録画中フラグ
                isConverting: false,       // 変換中フラグ
                capturedFrames: []         // キャプチャしたフレーム画像
            },

            // 表示設定
            display: {
                gridMode: 'grid'           // グリッドモード: 'grid', 'column', 'row'
            }
        };

        // ===== DOM要素の取得 =====
        document.addEventListener('DOMContentLoaded', () => {
            // 描画関連
            state.elements.video = document.getElementById('video');
            state.elements.canvas = document.getElementById('canvas');
            state.elements.ctx = state.elements.canvas.getContext('2d');

            // UIボタン
            state.elements.playStopBtn = document.getElementById('playStopBtn');
            state.elements.recordBtn = document.getElementById('recordBtn');
            state.elements.focusModeBtn = document.getElementById('focusModeBtn');
            state.elements.focusSlider = document.getElementById('focusSlider');
            state.elements.focusValue = document.getElementById('focusValue');
            state.elements.errorMessage = document.getElementById('errorMessage');

            // Canvasサイズの初期設定
            resizeCanvas();

            // イベントリスナーの設定
            setupEventListeners();

            // カメラの初期化
            initCamera();
        });

        // ===== Canvasサイズの設定 =====
        function resizeCanvas() {
            state.elements.canvas.width = window.innerWidth;
            state.elements.canvas.height = window.innerHeight;
            debugLog(`Canvas resized: ${state.elements.canvas.width}x${state.elements.canvas.height}`);
        }

        // ===== イベントリスナーの設定 =====
        function setupEventListeners() {
            // ウィンドウリサイズ
            window.addEventListener('resize', resizeCanvas);

            // ページ可視性変更（タブ切り替え時の省電力対応）
            document.addEventListener('visibilitychange', handleVisibilityChange);

            // グリッドモードボタン（頻繁にアクセスしないのでキャッシュ不要）
            document.getElementById('gridBtn').addEventListener('click', () => setGridMode('grid'));
            document.getElementById('columnBtn').addEventListener('click', () => setGridMode('column'));
            document.getElementById('rowBtn').addEventListener('click', () => setGridMode('row'));

            // 再生/停止ボタン（トグル）
            state.elements.playStopBtn.addEventListener('click', toggleAnimation);

            // 録画ボタン（1ループ自動撮影）
            state.elements.recordBtn.addEventListener('click', recordOneLoop);

            // フォーカスモードボタン
            state.elements.focusModeBtn.addEventListener('click', toggleFocusMode);

            // フォーカススライダー
            state.elements.focusSlider.addEventListener('input', onFocusSliderChange);
        }

        // ===== ページ可視性変更ハンドラー =====
        function handleVisibilityChange() {
            if (document.hidden) {
                // ページが非表示になった時
                debugLog('ページ非表示：省電力モード');

                // 録画中は中断しない
                if (state.recording.isRecording) {
                    debugLog('録画中のため一時停止をスキップ');
                    return;
                }

                // アニメーション再生中なら一時停止
                if (state.animation.isPlaying) {
                    state.animation.wasPausedByVisibility = true;
                    stopAnimation();
                    debugLog('アニメーションを一時停止');
                }
            } else {
                // ページが表示された時
                debugLog('ページ表示：復帰');

                // 可視性変更で一時停止されていた場合は再開
                if (state.animation.wasPausedByVisibility) {
                    state.animation.wasPausedByVisibility = false;
                    startAnimation();
                    debugLog('アニメーションを再開');
                }
            }
        }

        // ===== カメラの初期化 =====
        async function initCamera() {
            debugLog('カメラを初期化中...');

            // 描画ループをすぐに開始（ビデオ準備前でも）
            startDrawLoop();

            try {
                // カメラストリームを取得
                const stream = await acquireCameraStream();

                // ビデオトラックを取得
                state.camera.track = stream.getVideoTracks()[0];
                debugLog('カメラトラック取得:', state.camera.track.label);
                debugLog('トラック設定:', JSON.stringify(state.camera.track.getSettings()));

                // カメラの能力を確認
                checkCameraCapabilities();

                // video要素をセットアップ
                await setupVideoElement(stream);

            } catch (error) {
                console.error('カメラの初期化に失敗:', error);
                showError('カメラへのアクセスができませんでした。\nカメラへのアクセスを許可してください。\n\nエラー: ' + error.message);
            }
        }

        // ===== 描画ループを開始 =====
        function startDrawLoop() {
            requestAnimationFrame(draw);
            debugLog('描画ループを開始');
        }

        // ===== カメラストリームを取得（3段階フォールバック） =====
        async function acquireCameraStream() {
            // 1段階目: exact environment（アウトカメラを厳密に指定）
            const exactConstraints = {
                video: {
                    facingMode: { exact: 'environment' },
                    width: { ideal: CONFIG.VIDEO_WIDTH },
                    height: { ideal: CONFIG.VIDEO_HEIGHT }
                },
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(exactConstraints);
                debugLog('アウトカメラ(exact)で取得成功');
                return stream;
            } catch (e) {
                debugLog('exact environment指定が失敗、preferで再試行...', e.message);
            }

            // 2段階目: prefer environment（アウトカメラを優先指定）
            const preferConstraints = {
                video: {
                    facingMode: 'environment',
                    width: { ideal: CONFIG.VIDEO_WIDTH },
                    height: { ideal: CONFIG.VIDEO_HEIGHT }
                },
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(preferConstraints);
                debugLog('アウトカメラ(prefer)で取得成功');
                return stream;
            } catch (e) {
                debugLog('environment指定が失敗、制約なしで再試行...', e.message);
            }

            // 3段階目: 制約なし（どのカメラでも可）
            const fallbackConstraints = {
                video: {
                    width: { ideal: CONFIG.VIDEO_WIDTH },
                    height: { ideal: CONFIG.VIDEO_HEIGHT }
                },
                audio: false
            };

            const stream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
            debugLog('制約なしで取得成功');
            return stream;
        }

        // ===== video要素のセットアップ =====
        async function setupVideoElement(stream) {
            // video要素の属性を設定
            state.elements.video.setAttribute('autoplay', '');
            state.elements.video.setAttribute('playsinline', '');
            state.elements.video.setAttribute('muted', '');
            state.elements.video.muted = true;

            // ストリームをvideo要素に接続
            state.elements.video.srcObject = stream;
            debugLog('ストリームをvideo要素に接続');

            // 再生を開始
            await playVideoWithRetry();

            // デバッグ用：状態確認
            scheduleVideoStateCheck();
        }

        // ===== video再生（リトライ付き） =====
        async function playVideoWithRetry() {
            const playVideo = async () => {
                try {
                    const playPromise = state.elements.video.play();
                    if (playPromise !== undefined) {
                        await playPromise;
                        debugLog('video.play() 成功');
                    }
                } catch (playError) {
                    console.error('video.play() 失敗:', playError);
                    // play()が失敗した場合、ユーザーインタラクション後に再試行
                    const retryPlay = async () => {
                        try {
                            await state.elements.video.play();
                            debugLog('ユーザークリック後のplay()成功');
                        } catch (e) {
                            console.error('クリック後のplay()も失敗:', e);
                        }
                    };
                    document.body.addEventListener('click', retryPlay, { once: true });
                    document.body.addEventListener('touchstart', retryPlay, { once: true });
                }
            };

            // loadedmetadataイベントで再生開始
            if (state.elements.video.readyState >= 1) {
                debugLog('メタデータ読み込み済み、play()を呼び出し');
                await playVideo();
            } else {
                state.elements.video.addEventListener('loadedmetadata', async () => {
                    debugLog('loadedmetadata イベント発火');
                    await playVideo();
                }, { once: true });
            }
        }

        // ===== デバッグ用：video状態確認をスケジュール =====
        function scheduleVideoStateCheck() {
            if (!CONFIG.DEBUG) return;  // デバッグモード無効時はスキップ

            const checkVideoState = () => {
                debugLog(`ビデオ状態: readyState=${state.elements.video.readyState}, ` +
                         `size=${state.elements.video.videoWidth}x${state.elements.video.videoHeight}, ` +
                         `paused=${state.elements.video.paused}, ended=${state.elements.video.ended}, ` +
                         `srcObject=${state.elements.video.srcObject ? 'あり' : 'なし'}`);
            };

            setTimeout(checkVideoState, 1000);
            setTimeout(checkVideoState, 3000);
            setTimeout(checkVideoState, 5000);
        }

        // ===== カメラの能力を確認 =====
        function checkCameraCapabilities() {
            if (!state.camera.track || typeof state.camera.track.getCapabilities !== 'function') {
                debugLog('getCapabilities未サポート');
                return;
            }

            const capabilities = state.camera.track.getCapabilities();
            debugLog('カメラの能力:', capabilities);

            // フォーカス制御のサポートを確認
            if (capabilities.focusMode) {
                state.camera.focusSupported = true;
                const supportedModes = capabilities.focusMode;
                debugLog('サポートされているフォーカスモード:', supportedModes);

                // マニュアルフォーカスのサポートを確認
                state.camera.mfSupported = supportedModes.includes('manual');

                if (state.camera.mfSupported && capabilities.focusDistance) {
                    // カメラの能力を取得し、設定範囲内でクリップ
                    const cameraMin = capabilities.focusDistance.min || 0;
                    const cameraMax = capabilities.focusDistance.max || 2;
                    state.camera.focusDistanceMin = Math.max(cameraMin, CONFIG.FOCUS_MIN_M);
                    state.camera.focusDistanceMax = Math.min(cameraMax, CONFIG.FOCUS_MAX_M);
                    debugLog(`フォーカス距離範囲: ${state.camera.focusDistanceMin}m - ${state.camera.focusDistanceMax}m`);

                    // スライダーの範囲を設定（cmに変換）
                    state.elements.focusSlider.min = Math.round(state.camera.focusDistanceMin * 100);
                    state.elements.focusSlider.max = Math.round(state.camera.focusDistanceMax * 100);
                    state.elements.focusSlider.value = Math.round((state.camera.focusDistanceMin + state.camera.focusDistanceMax) / 2 * 100);
                }

                // フォーカスUIを有効化
                state.elements.focusModeBtn.disabled = false;
            } else {
                debugLog('フォーカス制御は未サポート');
            }
        }

        // ===== エラーメッセージを表示 =====
        function showError(message) {
            state.elements.errorMessage.textContent = message;
            state.elements.errorMessage.style.display = 'block';
        }

        // ===== グリッドモードの設定 =====
        function setGridMode(mode) {
            state.display.gridMode = mode;
            debugLog('グリッドモード変更:', mode);

            // ボタンのアクティブ状態を更新
            document.querySelectorAll('.grid-buttons button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
        }

        // ===== 描画ループ =====
        function draw() {
            const w = state.elements.canvas.width;
            const h = state.elements.canvas.height;

            // 背景をクリア
            state.elements.ctx.fillStyle = '#000';
            state.elements.ctx.fillRect(0, 0, w, h);

            // カメラ映像がまだ準備できていない場合
            if (!state.elements.video ||
                state.elements.video.readyState < state.elements.video.HAVE_CURRENT_DATA ||
                state.elements.video.videoWidth === 0 ||
                state.elements.video.videoHeight === 0) {
                // 待機中のメッセージを表示
                state.elements.ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                state.elements.ctx.font = '16px sans-serif';
                state.elements.ctx.textAlign = 'center';
                state.elements.ctx.fillText('カメラを準備中...', w / 2, h / 2);

                // グリッドラインは表示
                drawGridLines();

                requestAnimationFrame(draw);
                return;
            }

            const vw = state.elements.video.videoWidth;
            const vh = state.elements.video.videoHeight;

            if (state.animation.isPlaying) {
                // アニメーション再生中: 現在のフレームのみを全画面表示
                drawFullFrame(state.animation.currentFrame, vw, vh, w, h);
            } else {
                // プレビューモード: カメラ映像全体を表示してグリッドラインを描画
                drawPreview(vw, vh, w, h);
            }

            requestAnimationFrame(draw);
        }

        // ===== プレビュー描画（グリッドライン付き） =====
        function drawPreview(vw, vh, w, h) {
            // カメラ映像のアスペクト比を維持しながら画面全体に表示
            const videoAspect = vw / vh;
            const canvasAspect = w / h;

            let drawWidth, drawHeight, drawX, drawY;

            if (canvasAspect > videoAspect) {
                // キャンバスの方が横長: 幅に合わせる（カバー表示）
                drawWidth = w;
                drawHeight = w / videoAspect;
                drawX = 0;
                drawY = (h - drawHeight) / 2;
            } else {
                // キャンバスの方が縦長: 高さに合わせる（カバー表示）
                drawHeight = h;
                drawWidth = h * videoAspect;
                drawX = (w - drawWidth) / 2;
                drawY = 0;
            }

            // カメラ映像を描画
            state.elements.ctx.drawImage(state.elements.video, drawX, drawY, drawWidth, drawHeight);

            // グリッドラインを描画
            drawGridLines();
        }

        // ===== グリッドラインを描画 =====
        function drawGridLines() {
            const w = state.elements.canvas.width;
            const h = state.elements.canvas.height;

            state.elements.ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            state.elements.ctx.lineWidth = 2;

            if (state.display.gridMode === 'grid') {
                // 田んぼモード: 縦線と横線
                state.elements.ctx.beginPath();
                state.elements.ctx.moveTo(w / 2, 0);
                state.elements.ctx.lineTo(w / 2, h);
                state.elements.ctx.stroke();

                state.elements.ctx.beginPath();
                state.elements.ctx.moveTo(0, h / 2);
                state.elements.ctx.lineTo(w, h / 2);
                state.elements.ctx.stroke();
            } else if (state.display.gridMode === 'column') {
                // タテ短冊モード: 縦線3本
                for (let i = 1; i < 4; i++) {
                    state.elements.ctx.beginPath();
                    state.elements.ctx.moveTo(w / 4 * i, 0);
                    state.elements.ctx.lineTo(w / 4 * i, h);
                    state.elements.ctx.stroke();
                }
            } else if (state.display.gridMode === 'row') {
                // ヨコ短冊モード: 横線3本
                for (let i = 1; i < 4; i++) {
                    state.elements.ctx.beginPath();
                    state.elements.ctx.moveTo(0, h / 4 * i);
                    state.elements.ctx.lineTo(w, h / 4 * i);
                    state.elements.ctx.stroke();
                }
            }
        }

        // ===== フレームを等倍で中央描画 =====
        function drawFullFrame(frameIndex, vw, vh, w, h) {
            // フレームの領域を計算（ソース側）
            let sx, sy, sw, sh;

            if (state.display.gridMode === 'grid') {
                // 田んぼモード: 2x2
                const col = frameIndex % 2;
                const row = Math.floor(frameIndex / 2);
                sw = vw / 2;
                sh = vh / 2;
                sx = col * sw;
                sy = row * sh;
            } else if (state.display.gridMode === 'column') {
                // タテ短冊モード: 縦4分割
                sw = vw / 4;
                sh = vh;
                sx = frameIndex * sw;
                sy = 0;
            } else if (state.display.gridMode === 'row') {
                // ヨコ短冊モード: 横4分割
                sw = vw;
                sh = vh / 4;
                sx = 0;
                sy = frameIndex * sh;
            }

            // 等倍で中央に描画（引き伸ばさない）
            // 背景は既にdraw()でクリア済み（黒）
            const drawX = (w - sw) / 2;
            const drawY = (h - sh) / 2;
            state.elements.ctx.drawImage(state.elements.video, sx, sy, sw, sh, drawX, drawY, sw, sh);
        }

        // ===== アニメーション切り替え =====
        function toggleAnimation() {
            if (state.animation.isPlaying) {
                stopAnimation();
            } else {
                startAnimation();
            }
        }

        // ===== アニメーション開始 =====
        function startAnimation() {
            if (state.animation.isPlaying) return;

            state.animation.isPlaying = true;
            state.animation.currentFrame = 0;
            debugLog('アニメーション開始');

            // ボタン状態を更新（停止ボタンに変更）
            state.elements.playStopBtn.textContent = '⏹';
            state.elements.playStopBtn.title = '停止';

            // 設定間隔ごとにフレームを切り替え
            state.animation.intervalId = setInterval(() => {
                state.animation.currentFrame = (state.animation.currentFrame + 1) % CONFIG.TOTAL_FRAMES;
            }, CONFIG.FRAME_INTERVAL_MS);
        }

        // ===== アニメーション停止 =====
        function stopAnimation() {
            if (!state.animation.isPlaying) return;

            state.animation.isPlaying = false;
            state.animation.currentFrame = 0;
            debugLog('アニメーション停止');

            // ボタン状態を更新（再生ボタンに変更）
            state.elements.playStopBtn.textContent = '▶';
            state.elements.playStopBtn.title = '再生';

            // インターバルをクリア
            if (state.animation.intervalId) {
                clearInterval(state.animation.intervalId);
                state.animation.intervalId = null;
            }
        }

        // ===== タイムスタンプ生成（読みやすい形式） =====
        function getTimestamp() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `${year}${month}${day}_${hours}${minutes}${seconds}`;
        }

        // ===== 1ループ録画（ボタン押下で自動撮影） =====
        async function recordOneLoop() {
            // 既に録画中または変換中は無視
            if (state.recording.isRecording || state.recording.isConverting) return;

            debugLog('1ループ録画開始');
            state.recording.isRecording = true;
            state.recording.capturedFrames = [];

            // ボタンの状態を更新
            state.elements.recordBtn.classList.add('recording');
            state.elements.recordBtn.textContent = '撮影中';
            state.elements.recordBtn.disabled = true;

            // アニメーションを停止してリセット
            if (state.animation.intervalId) {
                clearInterval(state.animation.intervalId);
                state.animation.intervalId = null;
            }

            // フレームを順番にキャプチャ
            for (let i = 0; i < CONFIG.TOTAL_FRAMES; i++) {
                // フレームを設定
                state.animation.currentFrame = i;
                state.animation.isPlaying = true;

                // 再生ボタン更新
                state.elements.playStopBtn.textContent = '⏹';
                state.elements.playStopBtn.title = '停止';

                // フレームを描画（draw関数が自動で描画しているが、念のため待機）
                await new Promise(resolve => setTimeout(resolve, 50));

                // Canvasからフレームをキャプチャ
                const frameData = state.elements.canvas.toDataURL('image/png');
                state.recording.capturedFrames.push(frameData);
                debugLog(`フレーム ${i} キャプチャ完了`);

                // 次のフレームまで待機（最後のフレーム以外）
                if (i < CONFIG.TOTAL_FRAMES - 1) {
                    await new Promise(resolve => setTimeout(resolve, CONFIG.FRAME_INTERVAL_MS));
                }
            }

            // 録画終了
            state.recording.isRecording = false;
            state.animation.isPlaying = false;
            state.animation.currentFrame = 0;

            // 再生ボタンを元に戻す
            state.elements.playStopBtn.textContent = '▶';
            state.elements.playStopBtn.title = '再生';

            // MP4生成
            state.elements.recordBtn.textContent = '変換中...';
            state.recording.isConverting = true;

            try {
                await createMP4FromFrames();
            } catch (error) {
                console.error('MP4生成エラー:', error);
                // フォールバック：静止画として保存
                await createFallbackImage();
            }

            state.recording.isConverting = false;
            state.elements.recordBtn.disabled = false;
            state.elements.recordBtn.classList.remove('recording');
            state.elements.recordBtn.textContent = '⏺';
        }

        // ===== フレームからMP4を生成（h264-mp4-encoder使用） =====
        async function createMP4FromFrames() {
            // h264-mp4-encoderのサポート確認
            if (typeof HME === 'undefined') {
                debugLog('h264-mp4-encoder未ロード、静止画にフォールバック');
                await createFallbackImage();
                return;
            }

            try {
                const width = state.elements.canvas.width;
                const height = state.elements.canvas.height;
                const fps = CONFIG.VIDEO_FPS;

                // 幅と高さは2の倍数である必要がある
                const encoderWidth = Math.floor(width / 2) * 2;
                const encoderHeight = Math.floor(height / 2) * 2;

                debugLog('MP4エンコード開始:', encoderWidth, 'x', encoderHeight, '@', fps, 'fps');

                // エンコーダーを作成（非同期）
                const encoder = await HME.createH264MP4Encoder();
                encoder.width = encoderWidth;
                encoder.height = encoderHeight;
                encoder.frameRate = fps;
                encoder.quantizationParameter = CONFIG.VIDEO_QUALITY;
                encoder.initialize();

                // オフスクリーンCanvas（リサイズ用）
                const offscreen = document.createElement('canvas');
                offscreen.width = encoderWidth;
                offscreen.height = encoderHeight;
                const offCtx = offscreen.getContext('2d');

                // 各フレームを追加
                for (let i = 0; i < state.recording.capturedFrames.length; i++) {
                    const img = new Image();
                    img.src = state.recording.capturedFrames[i];
                    await new Promise(resolve => img.onload = resolve);

                    offCtx.drawImage(img, 0, 0, encoderWidth, encoderHeight);
                    const imageData = offCtx.getImageData(0, 0, encoderWidth, encoderHeight);
                    encoder.addFrameRgba(imageData.data);
                    debugLog('フレーム追加:', i + 1, '/', state.recording.capturedFrames.length);
                }

                // エンコード完了
                encoder.finalize();

                // MP4データを取得
                const mp4Data = encoder.FS.readFile(encoder.outputFilename);
                encoder.delete();

                // Blobを作成してダウンロード
                const blob = new Blob([mp4Data], { type: 'video/mp4' });
                downloadBlob(blob, `fretanime_${getTimestamp()}.mp4`);

                debugLog('MP4生成完了:', blob.size, 'bytes');

            } catch (error) {
                console.error('MP4生成エラー:', error);
                // フォールバック
                await createFallbackImage();
            }
        }

        // ===== フォールバック：静止画として保存 =====
        async function createFallbackImage() {
            debugLog('MP4が使用できないため静止画として保存');

            // 簡易的にPNG連番として保存
            // または最初のフレームだけをPNGで保存
            const blob = await (await fetch(state.recording.capturedFrames[0])).blob();
            downloadBlob(blob, `fretanime_${getTimestamp()}_frame0.png`);

            alert('お使いの環境ではMP4録画がサポートされていません。\n静止画として保存しました。');
        }

        // ===== Blobをダウンロード =====
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            debugLog('ファイル保存:', filename);
        }

        // ===== フォーカスモードの切り替え =====
        async function toggleFocusMode() {
            if (!state.camera.focusSupported) return;

            if (state.camera.focusMode === 'continuous') {
                // MFモードに切り替え
                if (!state.camera.mfSupported) {
                    debugLog('マニュアルフォーカスは未サポート');
                    return;
                }

                state.camera.focusMode = 'manual';
                state.elements.focusModeBtn.textContent = 'MF';
                state.elements.focusModeBtn.classList.add('active');
                state.elements.focusSlider.disabled = false;

                // 現在のスライダー値でフォーカスを設定
                const distance = state.elements.focusSlider.value / 100;  // cmをmに変換
                await setFocusDistance(distance);
                state.elements.focusValue.textContent = `${state.elements.focusSlider.value}cm`;

                debugLog('マニュアルフォーカスモードに切り替え');
            } else {
                // AFモードに切り替え
                state.camera.focusMode = 'continuous';
                state.elements.focusModeBtn.textContent = 'AF';
                state.elements.focusModeBtn.classList.remove('active');
                state.elements.focusSlider.disabled = true;
                state.elements.focusValue.textContent = 'AUTO';

                await setAutoFocus();
                debugLog('オートフォーカスモードに切り替え');
            }
        }

        // ===== フォーカススライダーの変更 =====
        async function onFocusSliderChange(event) {
            if (state.camera.focusMode !== 'manual') return;

            const value = event.target.value;
            const distance = value / 100;  // cmをmに変換

            state.elements.focusValue.textContent = `${value}cm`;
            await setFocusDistance(distance);
        }

        // ===== オートフォーカスを設定 =====
        async function setAutoFocus() {
            if (!state.camera.track) return;

            try {
                await state.camera.track.applyConstraints({
                    advanced: [{ focusMode: 'continuous' }]
                });
                debugLog('オートフォーカスを設定しました');
            } catch (error) {
                console.error('オートフォーカスの設定に失敗:', error);
            }
        }

        // ===== フォーカス距離を設定 =====
        async function setFocusDistance(distance) {
            if (!state.camera.track) return;

            try {
                await state.camera.track.applyConstraints({
                    advanced: [{
                        focusMode: 'manual',
                        focusDistance: distance
                    }]
                });
                debugLog(`フォーカス距離を設定: ${distance}m`);
            } catch (error) {
                console.error('フォーカス距離の設定に失敗:', error);
            }
        }
    </script>
</body>
