<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fretanime-mf</title>
    <!-- h264-mp4-encoder: WASM版H.264エンコーダー（SharedArrayBuffer不要） -->
    <!-- ライセンス: MIT (h264-mp4-encoder) + Public Domain (minih264) + MPL 1.1 (libmp4v2) -->
    <script src="https://unpkg.com/h264-mp4-encoder@1.0.12/embuild/dist/h264-mp4-encoder.web.js"
            integrity="sha384-6NZ5RcUgpHzi0/ouwZRpgRLOXAWfPdQlDj+KVSTn18Zds1Igbs/gVio8A8NG97x1"
            crossorigin="anonymous"></script>
    <style>
        /* ===== CSS変数 ===== */
        :root {
            --color-bg: #000;
            --color-overlay: rgba(0, 0, 0, 0.6);
            --color-overlay-dark: rgba(0, 0, 0, 0.8);
            --color-button: rgba(255, 255, 255, 0.2);
            --color-button-hover: rgba(255, 255, 255, 0.3);
            --color-active: #4a90d9;
            --color-recording: #d94a4a;
            --color-text: white;
            --color-text-muted: rgba(255, 255, 255, 0.5);
            --color-divider: rgba(255, 255, 255, 0.3);
        }

        /* ===== リセット & 基本スタイル ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;  /* スクロール禁止 */
            background: var(--color-bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* ===== カメラ映像（画面外に配置） ===== */
        /* 注意: display:noneはChromebookで映像処理に問題を起こす可能性があるため、
           画面外に配置して非表示にする */
        #video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* ===== 描画Canvas（フルスクリーン） ===== */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        /* ===== エラーメッセージ ===== */
        #errorMessage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--color-text);
            font-size: 18px;
            text-align: center;
            padding: 20px;
            background: var(--color-overlay-dark);
            border-radius: 10px;
            z-index: 200;  /* CONFIG.Z_INDEX_ERROR と同期 */
            display: none;
        }

        /* ===== UIオーバーレイ（右上） ===== */
        .ui-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--color-overlay);
            padding: 20px 30px;
            border-radius: 16px;
            z-index: 100;  /* CONFIG.Z_INDEX_UI と同期 */
        }

        /* ===== ボタン共通スタイル ===== */
        button {
            padding: 20px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            color: var(--color-text);
            background: var(--color-button);
            transition: background 0.2s, transform 0.1s;
            min-width: 88px;
        }

        button:hover {
            background: var(--color-button-hover);
        }

        button:active {
            transform: scale(0.95);
        }

        button.active {
            background: var(--color-active);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button:disabled:hover {
            background: var(--color-button);
        }

        /* ===== 録画中のスタイル ===== */
        button.recording {
            background: var(--color-recording);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* ===== フォーカスコントロール ===== */
        .focus-control {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .focus-slider {
            width: 500px;
            height: 12px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--color-divider);
            border-radius: 6px;
            outline: none;
        }

        .focus-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            background: var(--color-text);
            border-radius: 50%;
            cursor: pointer;
        }

        .focus-slider:disabled {
            opacity: 0.4;
        }

        .focus-slider:disabled::-webkit-slider-thumb {
            cursor: not-allowed;
        }

        /* ===== 区切り線 ===== */
        .divider {
            width: 2px;
            height: 48px;
            background: var(--color-divider);
        }

        /* ===== グリッドモードボタン ===== */
        .grid-buttons {
            display: flex;
            gap: 10px;
        }

        /* ===== 再生/録画ボタン ===== */
        .playback-buttons {
            display: flex;
            gap: 10px;
        }

        /* ===== デバッグパネル（キャリブレーション用） ===== */
        .debug-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--color-overlay-dark);
            padding: 16px 20px;
            border-radius: 12px;
            z-index: 100;
            font-family: monospace;
            font-size: 14px;
            color: var(--color-text);
            line-height: 1.6;
            display: none;  /* CONFIG.DEBUGで制御 */
        }

        .debug-panel.visible {
            display: block;
        }

        .debug-panel h3 {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .debug-panel .section {
            margin-bottom: 12px;
        }

        .debug-panel .section:last-child {
            margin-bottom: 0;
        }

        .debug-panel .value {
            color: #4fc3f7;
        }

        .debug-panel .label {
            color: var(--color-text-muted);
        }
    </style>
</head>
<body>
    <!-- カメラ映像（画面外に配置、Canvasへの描画元） -->
    <video id="video" autoplay playsinline muted width="1280" height="720"></video>

    <!-- 描画Canvas（フルスクリーン） -->
    <canvas id="canvas"></canvas>

    <!-- エラーメッセージ -->
    <div id="errorMessage"></div>

    <!-- デバッグパネル（キャリブレーション用） -->
    <div id="debugPanel" class="debug-panel">
        <div class="section">
            <h3>カメラ能力</h3>
            <div><span class="label">focusDistance.min:</span> <span id="dbgFocusMin" class="value">-</span></div>
            <div><span class="label">focusDistance.max:</span> <span id="dbgFocusMax" class="value">-</span></div>
            <div><span class="label">focusDistance.step:</span> <span id="dbgFocusStep" class="value">-</span></div>
        </div>
        <div class="section">
            <h3>現在のAPI値</h3>
            <div><span class="label">設定値:</span> <span id="dbgFocusSet" class="value">-</span></div>
            <div><span class="label">適用値:</span> <span id="dbgFocusActual" class="value">-</span></div>
            <div><span class="label">focusMode:</span> <span id="dbgFocusMode" class="value">-</span></div>
        </div>
        <div class="section">
            <h3>UI値</h3>
            <div><span class="label">スライダー:</span> <span id="dbgSliderValue" class="value">-</span></div>
            <div><span class="label">表示:</span> <span id="dbgDisplayValue" class="value">-</span></div>
        </div>
    </div>

    <!-- UIオーバーレイ（右上） -->
    <div class="ui-container">
        <!-- フォーカスコントロール（新規追加） -->
        <div class="focus-control">
            <button id="focusModeBtn" disabled>∞</button>
            <input type="range" id="focusSlider" class="focus-slider"
                   min="0.02" max="5" value="0.02" step="0.01" disabled>
        </div>

        <!-- 区切り -->
        <div class="divider"></div>

        <!-- グリッドモードボタン -->
        <div class="grid-buttons">
            <button id="gridBtn" class="active" data-mode="grid" title="田んぼ分割">田</button>
            <button id="columnBtn" data-mode="column" title="タテ短冊">タテ</button>
            <button id="rowBtn" data-mode="row" title="ヨコ短冊">ヨコ</button>
        </div>

        <!-- 区切り -->
        <div class="divider"></div>

        <!-- 再生/録画ボタン -->
        <div class="playback-buttons">
            <button id="playStopBtn" title="再生/停止">▶</button>
            <button id="recordBtn" title="録画">⏺</button>
        </div>
    </div>

    <script>
        // ===== 設定定数 =====
        const CONFIG = {
            // アニメーション設定
            FRAME_INTERVAL_MS: 250,      // 1フレームの表示時間（ミリ秒）
            TOTAL_FRAMES: 4,             // フレーム数

            // カメラ設定
            VIDEO_WIDTH: 1280,
            VIDEO_HEIGHT: 720,

            // フォーカス設定（API値）
            FOCUS_INFINITY_VALUE: 5,     // ∞モードで使用する値（MFの最大値と同じ）
            FOCUS_MIN_API: 0.02,         // スライダー最小値
            FOCUS_MAX_API: 5,            // スライダー最大値（実効範囲）

            // 録画設定
            VIDEO_FPS: 4,
            VIDEO_QUALITY: 26,           // h264-mp4-encoder品質（10-51、低いほど高品質）

            // UI設定（CSS側と同期が必要）
            Z_INDEX_UI: 100,             // UIコンテナのz-index
            Z_INDEX_ERROR: 200,          // エラーメッセージのz-index

            // タイミング設定
            FRAME_CAPTURE_DELAY_MS: 50,  // フレームキャプチャ前の描画待機時間
            DEBUG_CHECK_INTERVALS_MS: [1000, 3000, 5000],  // デバッグ用状態確認タイミング

            // デバッグモード（キャリブレーション時はtrue）
            DEBUG: true
        };

        // ===== デバッグログ出力 =====
        function debugLog(...args) {
            if (CONFIG.DEBUG) {
                console.log(...args);
            }
        }

        /**
         * デバッグパネルにカメラ能力を表示する
         * @param {MediaTrackCapabilities} capabilities - カメラの能力情報
         */
        function updateDebugCapabilities(capabilities) {
            if (!CONFIG.DEBUG) return;

            if (capabilities.focusDistance) {
                state.elements.dbgFocusMin.textContent = capabilities.focusDistance.min ?? '-';
                state.elements.dbgFocusMax.textContent = capabilities.focusDistance.max ?? '-';
                state.elements.dbgFocusStep.textContent = capabilities.focusDistance.step ?? '-';
            } else {
                state.elements.dbgFocusMin.textContent = '未サポート';
                state.elements.dbgFocusMax.textContent = '未サポート';
                state.elements.dbgFocusStep.textContent = '未サポート';
            }
        }

        /**
         * デバッグパネルにフォーカス値を表示する
         * @param {number|string} setValue - 設定しようとしている値
         * @param {number|string} sliderValue - スライダーのUI値
         * @param {string} displayValue - 画面に表示する値
         */
        function updateDebugFocusValues(setValue, sliderValue, displayValue) {
            if (!CONFIG.DEBUG) return;

            state.elements.dbgFocusSet.textContent = setValue;
            state.elements.dbgSliderValue.textContent = sliderValue;
            state.elements.dbgDisplayValue.textContent = displayValue;

            // 実際に適用された値をgetSettings()から取得
            updateDebugActualValues();
        }

        /**
         * デバッグパネルの適用値を更新する
         */
        function updateDebugActualValues() {
            if (!CONFIG.DEBUG || !state.camera.track) return;

            const settings = state.camera.track.getSettings();
            state.elements.dbgFocusActual.textContent = settings.focusDistance ?? '-';
            state.elements.dbgFocusMode.textContent = settings.focusMode ?? '-';
        }

        // ===== 状態管理 =====
        const state = {
            // DOM要素
            elements: {
                video: null,               // video要素
                canvas: null,              // canvas要素
                ctx: null,                 // canvas 2Dコンテキスト
                // UIボタン
                playStopBtn: null,         // 再生/停止ボタン
                recordBtn: null,           // 録画ボタン
                focusModeBtn: null,        // AF/MF/∞ボタン
                focusSlider: null,         // フォーカススライダー
                errorMessage: null,        // エラーメッセージ
                gridButtons: null,         // グリッドボタン配列
                // デバッグパネル
                debugPanel: null,          // デバッグパネル本体
                dbgFocusMin: null,         // focusDistance.min表示
                dbgFocusMax: null,         // focusDistance.max表示
                dbgFocusStep: null,        // focusDistance.step表示
                dbgFocusSet: null,         // 設定値表示
                dbgFocusActual: null,      // 適用値表示
                dbgFocusMode: null,        // focusMode表示
                dbgSliderValue: null,      // スライダー値表示
                dbgDisplayValue: null      // 表示値
            },

            // カメラ関連
            camera: {
                track: null,               // カメラのビデオトラック
                focusSupported: false,     // フォーカス制御サポートフラグ
                mfSupported: false,        // マニュアルフォーカスサポートフラグ
                focusMode: 'infinity',     // UIフォーカスモード: 'infinity' | 'manual'
                targetFocusDistance: 10,   // 目標focusDistance（初期値=∞モード用の10）
                focusDistanceMin: 0.02,    // カメラのfocusDistance最小値
                focusDistanceMax: Infinity,// カメラのfocusDistance最大値
                watchdogId: null,          // フォーカス監視watchdogのインターバルID
                focusDebounceTimer: null   // スライダーのデバウンスタイマー
            },

            // アニメーション関連
            animation: {
                isPlaying: false,          // アニメーション再生中フラグ
                currentFrame: 0,           // 現在表示中のフレーム (0-3)
                intervalId: null,          // アニメーションのインターバルID
                wasPausedByVisibility: false  // ページ非表示で一時停止されたか
            },

            // 録画関連
            recording: {
                isRecording: false,        // 録画中フラグ
                isConverting: false,       // 変換中フラグ
                capturedFrames: []         // キャプチャしたフレーム画像
            },

            // 表示設定
            display: {
                gridMode: 'grid'           // グリッドモード: 'grid', 'column', 'row'
            }
        };

        // ===== DOM要素の取得 =====
        document.addEventListener('DOMContentLoaded', () => {
            // 描画関連
            state.elements.video = document.getElementById('video');
            state.elements.canvas = document.getElementById('canvas');
            state.elements.ctx = state.elements.canvas.getContext('2d');

            // UIボタン
            state.elements.playStopBtn = document.getElementById('playStopBtn');
            state.elements.recordBtn = document.getElementById('recordBtn');
            state.elements.focusModeBtn = document.getElementById('focusModeBtn');
            state.elements.focusSlider = document.getElementById('focusSlider');
            state.elements.errorMessage = document.getElementById('errorMessage');
            state.elements.gridButtons = document.querySelectorAll('.grid-buttons button');

            // デバッグパネル要素
            state.elements.debugPanel = document.getElementById('debugPanel');
            state.elements.dbgFocusMin = document.getElementById('dbgFocusMin');
            state.elements.dbgFocusMax = document.getElementById('dbgFocusMax');
            state.elements.dbgFocusStep = document.getElementById('dbgFocusStep');
            state.elements.dbgFocusSet = document.getElementById('dbgFocusSet');
            state.elements.dbgFocusActual = document.getElementById('dbgFocusActual');
            state.elements.dbgFocusMode = document.getElementById('dbgFocusMode');
            state.elements.dbgSliderValue = document.getElementById('dbgSliderValue');
            state.elements.dbgDisplayValue = document.getElementById('dbgDisplayValue');

            // デバッグモード時はデバッグパネルを表示
            if (CONFIG.DEBUG) {
                state.elements.debugPanel.classList.add('visible');
                // 適用値を定期的に更新（500msごと）
                setInterval(updateDebugActualValues, 500);
            }

            // Canvasサイズの初期設定
            resizeCanvas();

            // イベントリスナーの設定
            setupEventListeners();

            // カメラの初期化
            initCamera();

            // エンコーダーの事前ロード（非同期、カメラ初期化と並行）
            preloadEncoder();
        });

        // ===== Canvasサイズの設定 =====
        function resizeCanvas() {
            state.elements.canvas.width = window.innerWidth;
            state.elements.canvas.height = window.innerHeight;
            debugLog(`Canvas resized: ${state.elements.canvas.width}x${state.elements.canvas.height}`);
        }

        // ===== イベントリスナーの設定 =====
        function setupEventListeners() {
            // ウィンドウリサイズ
            window.addEventListener('resize', resizeCanvas);

            // ページ可視性変更（タブ切り替え時の省電力対応）
            document.addEventListener('visibilitychange', handleVisibilityChange);

            // グリッドモードボタン（頻繁にアクセスしないのでキャッシュ不要）
            document.getElementById('gridBtn').addEventListener('click', () => setGridMode('grid'));
            document.getElementById('columnBtn').addEventListener('click', () => setGridMode('column'));
            document.getElementById('rowBtn').addEventListener('click', () => setGridMode('row'));

            // 再生/停止ボタン（トグル）
            state.elements.playStopBtn.addEventListener('click', toggleAnimation);

            // 録画ボタン（1ループ自動撮影）
            state.elements.recordBtn.addEventListener('click', recordOneLoop);

            // フォーカスモードボタン
            state.elements.focusModeBtn.addEventListener('click', toggleFocusMode);

            // フォーカススライダー
            state.elements.focusSlider.addEventListener('input', handleFocusSliderChange);
        }

        // ===== ページ可視性変更ハンドラー =====
        function handleVisibilityChange() {
            if (document.hidden) {
                // ページが非表示になった時
                debugLog('ページ非表示：省電力モード');

                // 録画中は中断しない
                if (state.recording.isRecording) {
                    debugLog('録画中のため一時停止をスキップ');
                    return;
                }

                // アニメーション再生中なら一時停止
                if (state.animation.isPlaying) {
                    state.animation.wasPausedByVisibility = true;
                    stopAnimation();
                    debugLog('アニメーションを一時停止');
                }
            } else {
                // ページが表示された時
                debugLog('ページ表示：復帰');

                // 可視性変更で一時停止されていた場合は再開
                if (state.animation.wasPausedByVisibility) {
                    state.animation.wasPausedByVisibility = false;
                    startAnimation();
                    debugLog('アニメーションを再開');
                }
            }
        }

        /**
         * カメラを初期化し、映像ストリームを取得する
         * @returns {Promise<void>}
         */
        async function initCamera() {
            debugLog('カメラを初期化中...');

            // 描画ループをすぐに開始（ビデオ準備前でも）
            startDrawLoop();

            try {
                // カメラストリームを取得
                const stream = await acquireCameraStream();

                // ビデオトラックを取得
                state.camera.track = stream.getVideoTracks()[0];
                debugLog('カメラトラック取得:', state.camera.track.label);
                debugLog('トラック設定:', JSON.stringify(state.camera.track.getSettings()));

                // カメラの能力を確認
                await checkCameraCapabilities();

                // video要素をセットアップ
                await setupVideoElement(stream);

                // 初期フォーカス設定を適用（video再生開始後）
                await applyInitialFocus();

            } catch (error) {
                console.error('カメラの初期化に失敗:', error);
                showError('カメラへのアクセスができませんでした。\nカメラへのアクセスを許可してください。\n\nエラー: ' + error.message);
            }
        }

        // ===== 描画ループを開始 =====
        function startDrawLoop() {
            requestAnimationFrame(draw);
            debugLog('描画ループを開始');
        }

        /**
         * カメラストリームを取得する（3段階フォールバック）
         * 注意: focusModeはgetUserMediaでは指定しない（applyConstraintsで後から設定）
         * @returns {Promise<MediaStream>} カメラのメディアストリーム
         */
        async function acquireCameraStream() {
            // 1段階目: exact environment（アウトカメラを厳密に指定）
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { exact: 'environment' },
                        width: { ideal: CONFIG.VIDEO_WIDTH },
                        height: { ideal: CONFIG.VIDEO_HEIGHT }
                    },
                    audio: false
                });
                debugLog('アウトカメラ(exact)で取得成功');
                return stream;
            } catch (e) {
                debugLog('exact environment失敗:', e.message);
            }

            // 2段階目: prefer environment（アウトカメラを優先指定）
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: CONFIG.VIDEO_WIDTH },
                        height: { ideal: CONFIG.VIDEO_HEIGHT }
                    },
                    audio: false
                });
                debugLog('アウトカメラ(prefer)で取得成功');
                return stream;
            } catch (e) {
                debugLog('environment失敗:', e.message);
            }

            // 3段階目: 制約なし（どのカメラでも可）
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: CONFIG.VIDEO_WIDTH },
                    height: { ideal: CONFIG.VIDEO_HEIGHT }
                },
                audio: false
            });
            debugLog('制約なしで取得成功');
            return stream;
        }

        /**
         * video要素をセットアップし、ストリームを接続する
         * @param {MediaStream} stream - カメラのメディアストリーム
         * @returns {Promise<void>}
         */
        async function setupVideoElement(stream) {
            // video要素の属性を設定
            state.elements.video.setAttribute('autoplay', '');
            state.elements.video.setAttribute('playsinline', '');
            state.elements.video.setAttribute('muted', '');
            state.elements.video.muted = true;

            // ストリームをvideo要素に接続
            state.elements.video.srcObject = stream;
            debugLog('ストリームをvideo要素に接続');

            // 再生を開始し、完全に安定するまで待つ
            await playVideoAndWaitForStable();

            // デバッグ用：状態確認
            scheduleVideoStateCheck();
        }

        /**
         * video再生を開始し、完全に安定するまで待つ
         * @returns {Promise<void>}
         */
        async function playVideoAndWaitForStable() {
            return new Promise((resolve) => {
                const video = state.elements.video;

                // onplayingイベントで再生開始を検知
                const onPlaying = () => {
                    debugLog('video.onplaying イベント発火');
                    video.removeEventListener('playing', onPlaying);

                    // 追加で3秒待機してカメラを完全に安定させる
                    debugLog('カメラ安定化のため3秒待機...');
                    setTimeout(() => {
                        debugLog(`video安定確認: readyState=${video.readyState}, size=${video.videoWidth}x${video.videoHeight}`);
                        resolve();
                    }, 3000);
                };

                video.addEventListener('playing', onPlaying);

                // 再生を試みる
                const tryPlay = async () => {
                    try {
                        await video.play();
                        debugLog('video.play() 成功');
                    } catch (playError) {
                        console.error('video.play() 失敗:', playError);
                        // ユーザーインタラクション後に再試行
                        const retryPlay = async () => {
                            try {
                                await video.play();
                                debugLog('ユーザークリック後のplay()成功');
                            } catch (e) {
                                console.error('クリック後のplay()も失敗:', e);
                            }
                        };
                        document.body.addEventListener('click', retryPlay, { once: true });
                        document.body.addEventListener('touchstart', retryPlay, { once: true });
                    }
                };

                // メタデータ読み込み完了を待ってから再生
                if (video.readyState >= 1) {
                    debugLog('メタデータ読み込み済み、play()を呼び出し');
                    tryPlay();
                } else {
                    video.addEventListener('loadedmetadata', () => {
                        debugLog('loadedmetadata イベント発火');
                        tryPlay();
                    }, { once: true });
                }
            });
        }

        // ===== デバッグ用：video状態確認をスケジュール =====
        function scheduleVideoStateCheck() {
            if (!CONFIG.DEBUG) return;  // デバッグモード無効時はスキップ

            const checkVideoState = () => {
                debugLog(`ビデオ状態: readyState=${state.elements.video.readyState}, ` +
                         `size=${state.elements.video.videoWidth}x${state.elements.video.videoHeight}, ` +
                         `paused=${state.elements.video.paused}, ended=${state.elements.video.ended}, ` +
                         `srcObject=${state.elements.video.srcObject ? 'あり' : 'なし'}`);
            };

            CONFIG.DEBUG_CHECK_INTERVALS_MS.forEach(interval => {
                setTimeout(checkVideoState, interval);
            });
        }

        // ===== カメラの能力を確認 =====
        async function checkCameraCapabilities() {
            if (!state.camera.track || typeof state.camera.track.getCapabilities !== 'function') {
                debugLog('getCapabilities未サポート');
                return;
            }

            const capabilities = state.camera.track.getCapabilities();
            debugLog('カメラの能力:', capabilities);

            // デバッグパネルにカメラ能力を表示
            updateDebugCapabilities(capabilities);

            // フォーカス制御のサポートを確認
            if (capabilities.focusMode) {
                state.camera.focusSupported = true;
                const supportedModes = capabilities.focusMode;
                debugLog('サポートされているフォーカスモード:', supportedModes);

                // マニュアルフォーカスのサポートを確認
                state.camera.mfSupported = supportedModes.includes('manual');

                // カメラのfocusDistance範囲を保存
                if (capabilities.focusDistance) {
                    state.camera.focusDistanceMin = capabilities.focusDistance.min || 0;
                    state.camera.focusDistanceMax = capabilities.focusDistance.max || Infinity;
                    debugLog(`カメラのfocusDistance範囲: ${state.camera.focusDistanceMin} - ${state.camera.focusDistanceMax}`);

                    // スライダーの範囲を設定（実効範囲: 0.02〜5）
                    // 5以上は適用値が固定、10以上はInfinityになるため
                    const sliderMin = state.camera.focusDistanceMin || 0.02;
                    const sliderMax = 5;
                    const sliderStep = capabilities.focusDistance.step || 0.01;
                    state.elements.focusSlider.min = sliderMin;
                    state.elements.focusSlider.max = sliderMax;
                    state.elements.focusSlider.step = sliderStep;
                    state.elements.focusSlider.value = sliderMin; // 最小値から開始
                }

                // フォーカスUIを有効化
                state.elements.focusModeBtn.disabled = false;
                state.elements.focusModeBtn.classList.add('active');
                // 初期フォーカス設定はvideo再生開始後に行う（applyInitialFocusで実行）
            } else {
                debugLog('フォーカス制御は未サポート');
            }
        }

        /**
         * エラーメッセージを画面中央に表示する
         * @param {string} message - 表示するエラーメッセージ
         */
        function showError(message) {
            state.elements.errorMessage.textContent = message;
            state.elements.errorMessage.style.display = 'block';
        }

        /**
         * グリッドモードを設定する
         * @param {'grid' | 'column' | 'row'} mode - グリッドモード
         */
        function setGridMode(mode) {
            state.display.gridMode = mode;
            debugLog('グリッドモード変更:', mode);

            // ボタンのアクティブ状態を更新
            state.elements.gridButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
        }

        // ===== 描画ループ =====
        function draw() {
            const w = state.elements.canvas.width;
            const h = state.elements.canvas.height;

            // 背景をクリア
            state.elements.ctx.fillStyle = '#000';
            state.elements.ctx.fillRect(0, 0, w, h);

            // カメラ映像がまだ準備できていない場合
            if (!state.elements.video ||
                state.elements.video.readyState < state.elements.video.HAVE_CURRENT_DATA ||
                state.elements.video.videoWidth === 0 ||
                state.elements.video.videoHeight === 0) {
                // 待機中のメッセージを表示
                state.elements.ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                state.elements.ctx.font = '16px sans-serif';
                state.elements.ctx.textAlign = 'center';
                state.elements.ctx.fillText('カメラを準備中...', w / 2, h / 2);

                // グリッドラインは表示
                drawGridLines();

                requestAnimationFrame(draw);
                return;
            }

            const vw = state.elements.video.videoWidth;
            const vh = state.elements.video.videoHeight;

            if (state.animation.isPlaying) {
                // アニメーション再生中: 現在のフレームのみを全画面表示
                drawFullFrame(state.animation.currentFrame, vw, vh, w, h);
            } else {
                // プレビューモード: カメラ映像全体を表示してグリッドラインを描画
                drawPreview(vw, vh, w, h);
            }

            requestAnimationFrame(draw);
        }

        /**
         * ビデオをキャンバスにカバー表示する際のスケール情報を計算する
         * @param {number} vw - ビデオの幅
         * @param {number} vh - ビデオの高さ
         * @param {number} w - キャンバスの幅
         * @param {number} h - キャンバスの高さ
         * @returns {{scale: number, drawWidth: number, drawHeight: number, drawX: number, drawY: number}}
         */
        function getCoverScale(vw, vh, w, h) {
            const videoAspect = vw / vh;
            const canvasAspect = w / h;

            if (canvasAspect > videoAspect) {
                // キャンバスの方が横長: 幅に合わせる
                const drawWidth = w;
                const drawHeight = w / videoAspect;
                return {
                    scale: w / vw,
                    drawWidth,
                    drawHeight,
                    drawX: 0,
                    drawY: (h - drawHeight) / 2
                };
            } else {
                // キャンバスの方が縦長: 高さに合わせる
                const drawWidth = h * videoAspect;
                const drawHeight = h;
                return {
                    scale: h / vh,
                    drawWidth,
                    drawHeight,
                    drawX: (w - drawWidth) / 2,
                    drawY: 0
                };
            }
        }

        // ===== プレビュー描画（グリッドライン付き） =====
        function drawPreview(vw, vh, w, h) {
            const { drawWidth, drawHeight, drawX, drawY } = getCoverScale(vw, vh, w, h);

            // カメラ映像を描画
            state.elements.ctx.drawImage(state.elements.video, drawX, drawY, drawWidth, drawHeight);

            // グリッドラインを描画
            drawGridLines();
        }

        // ===== グリッドライン設定 =====
        const GRID_LINES = {
            grid:   { vertical: [0.5], horizontal: [0.5] },           // 田んぼ: 縦1本、横1本
            column: { vertical: [0.25, 0.5, 0.75], horizontal: [] },  // タテ短冊: 縦3本
            row:    { vertical: [], horizontal: [0.25, 0.5, 0.75] }   // ヨコ短冊: 横3本
        };

        /**
         * 線を描画する
         * @param {number} x1 - 始点X
         * @param {number} y1 - 始点Y
         * @param {number} x2 - 終点X
         * @param {number} y2 - 終点Y
         */
        function drawLine(x1, y1, x2, y2) {
            state.elements.ctx.beginPath();
            state.elements.ctx.moveTo(x1, y1);
            state.elements.ctx.lineTo(x2, y2);
            state.elements.ctx.stroke();
        }

        /**
         * グリッドラインを描画する
         */
        function drawGridLines() {
            const w = state.elements.canvas.width;
            const h = state.elements.canvas.height;
            const lines = GRID_LINES[state.display.gridMode];

            state.elements.ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            state.elements.ctx.lineWidth = 2;

            // 縦線を描画
            lines.vertical.forEach(ratio => drawLine(w * ratio, 0, w * ratio, h));

            // 横線を描画
            lines.horizontal.forEach(ratio => drawLine(0, h * ratio, w, h * ratio));
        }

        /**
         * フレームのソース領域を計算する
         * @param {number} frameIndex - フレーム番号（0-3）
         * @param {number} vw - ビデオの幅
         * @param {number} vh - ビデオの高さ
         * @returns {{sx: number, sy: number, sw: number, sh: number}} ソース領域
         */
        function getFrameRect(frameIndex, vw, vh) {
            let sx, sy, sw, sh;

            if (state.display.gridMode === 'grid') {
                // 田んぼモード: 2x2
                const col = frameIndex % 2;
                const row = Math.floor(frameIndex / 2);
                sw = vw / 2;
                sh = vh / 2;
                sx = col * sw;
                sy = row * sh;
            } else if (state.display.gridMode === 'column') {
                // タテ短冊モード: 縦4分割
                sw = vw / 4;
                sh = vh;
                sx = frameIndex * sw;
                sy = 0;
            } else {
                // ヨコ短冊モード: 横4分割
                sw = vw;
                sh = vh / 4;
                sx = 0;
                sy = frameIndex * sh;
            }

            return { sx, sy, sw, sh };
        }

        /**
         * 指定フレームをプレビュー時のグリッドセルと同じサイズで画面中央に描画する
         * @param {number} frameIndex - フレーム番号（0-3）
         * @param {number} vw - ビデオの幅
         * @param {number} vh - ビデオの高さ
         * @param {number} w - キャンバスの幅
         * @param {number} h - キャンバスの高さ
         */
        function drawFullFrame(frameIndex, vw, vh, w, h) {
            const { sx, sy, sw, sh } = getFrameRect(frameIndex, vw, vh);
            const { scale } = getCoverScale(vw, vh, w, h);

            // スケーリングされたフレームサイズ（プレビュー時のグリッドセルと同じ大きさ）
            const scaledWidth = sw * scale;
            const scaledHeight = sh * scale;

            // 中央に配置
            const drawX = (w - scaledWidth) / 2;
            const drawY = (h - scaledHeight) / 2;

            // 背景は既にdraw()でクリア済み（黒）
            state.elements.ctx.drawImage(state.elements.video, sx, sy, sw, sh, drawX, drawY, scaledWidth, scaledHeight);
        }

        /**
         * 再生/停止ボタンの状態を更新する
         * @param {boolean} isPlaying - 再生中かどうか
         */
        function updatePlayButtonState(isPlaying) {
            state.elements.playStopBtn.textContent = isPlaying ? '⏹' : '▶';
            state.elements.playStopBtn.title = isPlaying ? '停止' : '再生';
        }

        // ===== アニメーション切り替え =====
        function toggleAnimation() {
            if (state.animation.isPlaying) {
                stopAnimation();
            } else {
                startAnimation();
            }
        }

        /**
         * アニメーション再生を開始する
         */
        function startAnimation() {
            if (state.animation.isPlaying) return;

            state.animation.isPlaying = true;
            state.animation.currentFrame = 0;
            debugLog('アニメーション開始');

            // ボタン状態を更新（停止ボタンに変更）
            updatePlayButtonState(true);

            // 設定間隔ごとにフレームを切り替え
            state.animation.intervalId = setInterval(() => {
                state.animation.currentFrame = (state.animation.currentFrame + 1) % CONFIG.TOTAL_FRAMES;
            }, CONFIG.FRAME_INTERVAL_MS);
        }

        /**
         * アニメーション再生を停止する
         */
        function stopAnimation() {
            if (!state.animation.isPlaying) return;

            state.animation.isPlaying = false;
            state.animation.currentFrame = 0;
            debugLog('アニメーション停止');

            // ボタン状態を更新（再生ボタンに変更）
            updatePlayButtonState(false);

            // インターバルをクリア
            if (state.animation.intervalId) {
                clearInterval(state.animation.intervalId);
                state.animation.intervalId = null;
            }
        }

        /**
         * ファイル名用のタイムスタンプを生成する
         * @returns {string} YYYYMMDD_HHMMSS形式のタイムスタンプ
         */
        function getTimestamp() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `${year}${month}${day}_${hours}${minutes}${seconds}`;
        }

        /**
         * 録画UIの状態を更新する
         * @param {'recording' | 'converting' | 'idle'} uiState - UI状態
         */
        function setRecordingUIState(uiState) {
            switch (uiState) {
                case 'recording':
                    state.elements.recordBtn.classList.add('recording');
                    state.elements.recordBtn.textContent = '撮影中';
                    state.elements.recordBtn.disabled = true;
                    break;
                case 'converting':
                    state.elements.recordBtn.textContent = '変換中...';
                    break;
                case 'idle':
                    state.elements.recordBtn.disabled = false;
                    state.elements.recordBtn.classList.remove('recording');
                    state.elements.recordBtn.textContent = '⏺';
                    break;
            }
        }

        /**
         * 4フレームを順番にキャプチャする
         * @returns {Promise<void>}
         */
        async function captureFrames() {
            // アニメーションを停止してリセット
            if (state.animation.intervalId) {
                clearInterval(state.animation.intervalId);
                state.animation.intervalId = null;
            }

            // キャプチャ開始時に状態を設定（ループ前に1回だけ）
            state.animation.isPlaying = true;
            updatePlayButtonState(true);

            // フレームを順番にキャプチャ
            for (let i = 0; i < CONFIG.TOTAL_FRAMES; i++) {
                // フレームを設定
                state.animation.currentFrame = i;

                // フレームを描画（draw関数が自動で描画しているが、念のため待機）
                await new Promise(resolve => setTimeout(resolve, CONFIG.FRAME_CAPTURE_DELAY_MS));

                // Canvasからフレームをキャプチャ
                const frameData = state.elements.canvas.toDataURL('image/png');
                state.recording.capturedFrames.push(frameData);
                debugLog(`フレーム ${i} キャプチャ完了`);

                // 次のフレームまで待機（最後のフレーム以外）
                if (i < CONFIG.TOTAL_FRAMES - 1) {
                    await new Promise(resolve => setTimeout(resolve, CONFIG.FRAME_INTERVAL_MS));
                }
            }

            // キャプチャ終了後の状態リセット
            state.animation.isPlaying = false;
            state.animation.currentFrame = 0;
            updatePlayButtonState(false);
        }

        /**
         * 1ループ分（4フレーム）を録画してMP4として保存する
         * @returns {Promise<void>}
         */
        async function recordOneLoop() {
            // 既に録画中または変換中は無視
            if (state.recording.isRecording || state.recording.isConverting) return;

            debugLog('1ループ録画開始');
            state.recording.isRecording = true;
            state.recording.capturedFrames = [];

            // 録画UI表示
            setRecordingUIState('recording');

            // フレームキャプチャ
            await captureFrames();

            // 録画終了、変換開始
            state.recording.isRecording = false;
            state.recording.isConverting = true;
            setRecordingUIState('converting');

            // MP4生成
            try {
                await createMP4FromFrames();
            } catch (error) {
                console.error('MP4生成エラー:', error);
                await createFallbackImage();
            }

            // 状態リセット・UI復帰
            state.recording.isConverting = false;
            setRecordingUIState('idle');
        }

        /**
         * h264-mp4-encoderを事前ロードする（ウォームアップ）
         * 初回録画時の遅延を解消するため、起動時に呼び出す
         * @returns {Promise<void>}
         */
        async function preloadEncoder() {
            if (typeof HME === 'undefined') {
                debugLog('h264-mp4-encoder 未ロード、事前ロードをスキップ');
                return;
            }

            try {
                const encoder = await HME.createH264MP4Encoder();
                encoder.delete();  // すぐに解放
                debugLog('h264-mp4-encoder 事前ロード完了');
            } catch (e) {
                debugLog('h264-mp4-encoder 事前ロード失敗:', e);
            }
        }

        /**
         * キャプチャしたフレームからMP4動画を生成する
         * h264-mp4-encoderを使用してH.264/MP4形式で出力
         * @returns {Promise<void>}
         */
        async function createMP4FromFrames() {
            // h264-mp4-encoderのサポート確認
            if (typeof HME === 'undefined') {
                debugLog('h264-mp4-encoder未ロード、静止画にフォールバック');
                await createFallbackImage();
                return;
            }

            try {
                const width = state.elements.canvas.width;
                const height = state.elements.canvas.height;
                const fps = CONFIG.VIDEO_FPS;

                // 幅と高さは2の倍数である必要がある
                const encoderWidth = Math.floor(width / 2) * 2;
                const encoderHeight = Math.floor(height / 2) * 2;

                debugLog('MP4エンコード開始:', encoderWidth, 'x', encoderHeight, '@', fps, 'fps');

                // エンコーダーを作成（非同期）
                const encoder = await HME.createH264MP4Encoder();
                encoder.width = encoderWidth;
                encoder.height = encoderHeight;
                encoder.frameRate = fps;
                encoder.quantizationParameter = CONFIG.VIDEO_QUALITY;
                encoder.initialize();

                // オフスクリーンCanvas（リサイズ用）
                // willReadFrequently: getImageData()を頻繁に呼ぶため最適化
                const offscreen = document.createElement('canvas');
                offscreen.width = encoderWidth;
                offscreen.height = encoderHeight;
                const offCtx = offscreen.getContext('2d', { willReadFrequently: true });

                // 各フレームを追加
                for (let i = 0; i < state.recording.capturedFrames.length; i++) {
                    const img = new Image();
                    img.src = state.recording.capturedFrames[i];
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = () => reject(new Error(`フレーム ${i} の読み込みに失敗`));
                    });

                    offCtx.drawImage(img, 0, 0, encoderWidth, encoderHeight);
                    const imageData = offCtx.getImageData(0, 0, encoderWidth, encoderHeight);
                    encoder.addFrameRgba(imageData.data);
                    debugLog('フレーム追加:', i + 1, '/', state.recording.capturedFrames.length);
                }

                // エンコード完了
                encoder.finalize();

                // MP4データを取得
                const mp4Data = encoder.FS.readFile(encoder.outputFilename);
                encoder.delete();

                // Blobを作成してダウンロード
                const blob = new Blob([mp4Data], { type: 'video/mp4' });
                downloadBlob(blob, `fretanime_${getTimestamp()}.mp4`);

                debugLog('MP4生成完了:', blob.size, 'bytes');

            } catch (error) {
                console.error('MP4生成エラー:', error);
                // フォールバック
                await createFallbackImage();
            }
        }

        /**
         * MP4生成失敗時のフォールバック処理
         * 最初のフレームをPNG画像として保存する
         * @returns {Promise<void>}
         */
        async function createFallbackImage() {
            debugLog('MP4が使用できないため静止画として保存');

            // キャプチャフレームの存在確認
            if (!state.recording.capturedFrames || state.recording.capturedFrames.length === 0) {
                console.error('フォールバック保存失敗: キャプチャフレームがありません');
                alert('撮影に失敗しました。もう一度お試しください。');
                return;
            }

            try {
                const blob = await (await fetch(state.recording.capturedFrames[0])).blob();
                downloadBlob(blob, `fretanime_${getTimestamp()}_frame0.png`);
                alert('お使いの環境ではMP4録画がサポートされていません。\n静止画として保存しました。');
            } catch (error) {
                console.error('フォールバック保存エラー:', error);
                alert('ファイルの保存に失敗しました。');
            }
        }

        /**
         * Blobデータをファイルとしてダウンロードする
         * @param {Blob} blob - ダウンロードするデータ
         * @param {string} filename - ファイル名
         */
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            debugLog('ファイル保存:', filename);
        }

        // =====================================================
        // フォーカス制御
        // =====================================================

        /**
         * フォーカスを設定する（以前うまくいっていた方式）
         * advancedオプションでfocusModeとfocusDistanceを同時に設定
         * @param {number} apiValue - 設定するfocusDistance値
         * @returns {Promise<boolean>} 成功したかどうか
         */
        async function setFocusDistance(apiValue) {
            if (!state.camera.track) return false;

            debugLog(`setFocusDistance呼び出し: apiValue=${apiValue}`);

            // 最大3回リトライ
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    // focusModeとfocusDistanceを同時に設定（これが最も確実）
                    await state.camera.track.applyConstraints({
                        advanced: [{
                            focusMode: 'manual',
                            focusDistance: apiValue
                        }]
                    });

                    // 設定が反映されるまで待機
                    await new Promise(resolve => setTimeout(resolve, 100));

                    // 設定後の実際の値を確認
                    const settings = state.camera.track.getSettings();
                    debugLog(`フォーカス設定試行${attempt + 1}: 要求=${apiValue}, 適用focusMode=${settings.focusMode}, 適用focusDistance=${settings.focusDistance}`);

                    if (settings.focusMode === 'manual') {
                        debugLog(`setFocusDistance成功（${attempt + 1}回目）`);
                        return true;
                    }

                    // focusModeがmanualでない場合、待機時間を増やして再試行
                    debugLog(`focusModeがmanualでないため再試行...（${attempt + 1}回目失敗）`);
                    await new Promise(resolve => setTimeout(resolve, 150));

                } catch (error) {
                    console.error(`フォーカス設定エラー（${attempt + 1}回目）:`, error);
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
            }

            console.warn('setFocusDistance: 3回試行しても設定が反映されませんでした');
            return false;
        }

        /**
         * フォーカスモードの切り替え（∞ ↔ MF）
         */
        async function toggleFocusMode() {
            if (!state.camera.focusSupported || !state.camera.mfSupported) return;

            if (state.camera.focusMode === 'infinity') {
                // ∞ → MF に切り替え
                debugLog('∞ → MF モード切り替え開始');

                const apiValue = parseFloat(state.elements.focusSlider.value);
                state.camera.targetFocusDistance = apiValue;
                const success = await setFocusDistance(apiValue);

                // UIを更新
                state.camera.focusMode = 'manual';
                state.elements.focusModeBtn.textContent = 'MF';
                state.elements.focusSlider.disabled = false;

                // 最終確認
                const settings = state.camera.track.getSettings();
                debugLog(`MFモード切り替え完了: success=${success}, 実際のfocusMode=${settings.focusMode}, focusDistance=${settings.focusDistance}`);
                updateDebugFocusValues(apiValue, apiValue, 'MF');

            } else {
                // MF → ∞ に切り替え
                debugLog('MF → ∞ モード切り替え開始');

                const infinityValue = CONFIG.FOCUS_INFINITY_VALUE;
                state.camera.targetFocusDistance = infinityValue;
                const success = await setFocusDistance(infinityValue);

                // UIを更新
                state.camera.focusMode = 'infinity';
                state.elements.focusModeBtn.textContent = '∞';
                state.elements.focusSlider.disabled = true;

                // 最終確認
                const settings = state.camera.track.getSettings();
                debugLog(`∞モード切り替え完了: success=${success}, 実際のfocusMode=${settings.focusMode}, focusDistance=${settings.focusDistance}`);
                updateDebugFocusValues(infinityValue, '-', '∞');
            }
        }

        /**
         * フォーカススライダーの変更（デバウンス付き）
         */
        function handleFocusSliderChange(event) {
            if (state.camera.focusMode !== 'manual') return;

            const apiValue = parseFloat(event.target.value);
            state.camera.targetFocusDistance = apiValue;
            updateDebugFocusValues(apiValue, apiValue, 'MF');

            if (state.camera.focusDebounceTimer) {
                clearTimeout(state.camera.focusDebounceTimer);
            }

            state.camera.focusDebounceTimer = setTimeout(async () => {
                await setFocusDistance(apiValue);
            }, 100);
        }

        /**
         * 初期フォーカス設定を適用する（video再生安定後に呼び出す）
         * 強制適用ループ: 5秒間、500msごとにfocusMode: 'manual'を強制適用
         * @returns {Promise<void>}
         */
        async function applyInitialFocus() {
            if (!state.camera.focusSupported || !state.camera.mfSupported) return;

            debugLog('========== 初期フォーカス強制適用開始 ==========');

            const targetFocusDistance = CONFIG.FOCUS_INFINITY_VALUE; // ∞モード
            state.camera.targetFocusDistance = targetFocusDistance;
            const maxAttempts = 10;               // 最大10回試行
            const intervalMs = 500;               // 500msごと
            let attempt = 0;
            let success = false;

            // 強制適用ループ
            while (attempt < maxAttempts && !success) {
                attempt++;
                debugLog(`強制適用試行 ${attempt}/${maxAttempts}`);

                // 現在の状態を確認
                const beforeSettings = state.camera.track.getSettings();
                debugLog(`  適用前: focusMode=${beforeSettings.focusMode}, focusDistance=${beforeSettings.focusDistance}`);

                // advancedオプションでfocusMode: 'manual'とfocusDistanceを同時に強制適用
                try {
                    await state.camera.track.applyConstraints({
                        advanced: [{
                            focusMode: 'manual',
                            focusDistance: targetFocusDistance
                        }]
                    });
                } catch (e) {
                    debugLog(`  適用エラー: ${e.message}`);
                }

                // 設定反映待機
                await new Promise(resolve => setTimeout(resolve, intervalMs));

                // 適用後の状態を確認
                const afterSettings = state.camera.track.getSettings();
                debugLog(`  適用後: focusMode=${afterSettings.focusMode}, focusDistance=${afterSettings.focusDistance}`);

                // focusModeがmanualになったら成功
                if (afterSettings.focusMode === 'manual') {
                    success = true;
                    debugLog(`========== 初期フォーカス適用成功（${attempt}回目） ==========`);
                }
            }

            if (!success) {
                debugLog('========== 初期フォーカス適用失敗（タイムアウト） ==========');
            }

            updateDebugFocusValues(targetFocusDistance, '-', '∞');

            // watchdog開始
            startFocusWatchdog();
        }

        /**
         * フォーカス監視watchdog（2秒ごと）
         * focusModeがmanualでなくなったら修復
         */
        function startFocusWatchdog() {
            debugLog('watchdog開始');

            state.camera.watchdogId = setInterval(async () => {
                if (!state.camera.track) return;

                const settings = state.camera.track.getSettings();

                if (settings.focusMode !== 'manual') {
                    debugLog(`watchdog修復: ${settings.focusMode} → manual, target=${state.camera.targetFocusDistance}`);
                    await setFocusDistance(state.camera.targetFocusDistance);
                }
            }, 2000);
        }

        /**
         * watchdog停止
         */
        function stopFocusWatchdog() {
            if (state.camera.watchdogId) {
                clearInterval(state.camera.watchdogId);
                state.camera.watchdogId = null;
            }
        }
    </script>
