<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fretanime-mf</title>
    <!-- FFmpeg.wasm for WebM to MP4 conversion -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <style>
        /* ===== リセット & 基本スタイル ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;  /* スクロール禁止 */
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* ===== カメラ映像（画面外に配置） ===== */
        /* 注意: display:noneはChromebookで映像処理に問題を起こす可能性があるため、
           画面外に配置して非表示にする */
        #video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* ===== 描画Canvas（フルスクリーン） ===== */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        /* ===== エラーメッセージ ===== */
        #errorMessage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            z-index: 200;
            display: none;
        }

        /* ===== UIオーバーレイ（右上） ===== */
        .ui-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 30px;
            border-radius: 16px;
            z-index: 100;
        }

        /* ===== ボタン共通スタイル ===== */
        button {
            padding: 20px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.2s, transform 0.1s;
            min-width: 88px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: scale(0.95);
        }

        button.active {
            background: #4a90d9;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button:disabled:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ===== 録画中のスタイル ===== */
        button.recording {
            background: #d94a4a;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* ===== フォーカスコントロール ===== */
        .focus-control {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .focus-slider {
            width: 400px;
            height: 12px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            outline: none;
        }

        .focus-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }

        .focus-slider:disabled {
            opacity: 0.4;
        }

        .focus-slider:disabled::-webkit-slider-thumb {
            cursor: not-allowed;
        }

        .focus-value {
            min-width: 110px;
            color: white;
            font-size: 24px;
            text-align: center;
        }

        /* ===== 区切り線 ===== */
        .divider {
            width: 2px;
            height: 48px;
            background: rgba(255, 255, 255, 0.3);
        }

        /* ===== グリッドモードボタン ===== */
        .grid-buttons {
            display: flex;
            gap: 10px;
        }

        /* ===== 再生/録画ボタン ===== */
        .playback-buttons {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <!-- カメラ映像（画面外に配置、Canvasへの描画元） -->
    <video id="video" autoplay playsinline muted width="1280" height="720"></video>

    <!-- 描画Canvas（フルスクリーン） -->
    <canvas id="canvas"></canvas>

    <!-- エラーメッセージ -->
    <div id="errorMessage"></div>

    <!-- UIオーバーレイ（右上） -->
    <div class="ui-container">
        <!-- フォーカスコントロール（新規追加） -->
        <div class="focus-control">
            <button id="focusModeBtn" disabled>AF</button>
            <input type="range" id="focusSlider" class="focus-slider"
                   min="2" max="100" value="50" step="1" disabled>
            <span id="focusValue" class="focus-value">AUTO</span>
        </div>

        <!-- 区切り -->
        <div class="divider"></div>

        <!-- グリッドモードボタン -->
        <div class="grid-buttons">
            <button id="gridBtn" class="active" data-mode="grid" title="田んぼ分割">田</button>
            <button id="columnBtn" data-mode="column" title="タテ短冊">タテ</button>
            <button id="rowBtn" data-mode="row" title="ヨコ短冊">ヨコ</button>
        </div>

        <!-- 区切り -->
        <div class="divider"></div>

        <!-- 再生/録画ボタン -->
        <div class="playback-buttons">
            <button id="playStopBtn" title="再生/停止">▶</button>
            <button id="recordBtn" title="録画">⏺</button>
        </div>
    </div>

    <script>
        // ===== 状態管理 =====
        let videoElement = null;          // video要素
        let canvas = null;                 // canvas要素
        let ctx = null;                    // canvas 2Dコンテキスト
        let videoTrack = null;             // カメラのビデオトラック
        let currentMode = 'grid';          // 現在のグリッドモード: 'grid', 'column', 'row'
        let isPlaying = false;             // アニメーション再生中フラグ
        let currentFrame = 0;              // 現在表示中のフレーム (0-3)
        let animationInterval = null;     // アニメーションのインターバルID
        let isRecording = false;           // 録画中フラグ
        let mediaRecorder = null;          // MediaRecorderインスタンス
        let recordedChunks = [];           // 録画データの配列
        let focusMode = 'continuous';      // フォーカスモード: 'continuous' or 'manual'
        let focusSupported = false;        // フォーカス制御サポートフラグ
        let mfSupported = false;           // マニュアルフォーカスサポートフラグ
        let focusDistanceMin = 0.02;       // フォーカス距離の最小値（2cm）
        let focusDistanceMax = 1.0;        // フォーカス距離の最大値（100cm）
        let ffmpeg = null;                 // FFmpegインスタンス
        let ffmpegLoaded = false;          // FFmpegロード済みフラグ
        let isConverting = false;          // 変換中フラグ

        // ===== DOM要素の取得 =====
        document.addEventListener('DOMContentLoaded', () => {
            videoElement = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            // Canvasサイズの初期設定
            resizeCanvas();

            // イベントリスナーの設定
            setupEventListeners();

            // カメラの初期化
            initCamera();
        });

        // ===== Canvasサイズの設定 =====
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            console.log(`Canvas resized: ${canvas.width}x${canvas.height}`);
        }

        // ===== イベントリスナーの設定 =====
        function setupEventListeners() {
            // ウィンドウリサイズ
            window.addEventListener('resize', resizeCanvas);

            // グリッドモードボタン
            document.getElementById('gridBtn').addEventListener('click', () => setGridMode('grid'));
            document.getElementById('columnBtn').addEventListener('click', () => setGridMode('column'));
            document.getElementById('rowBtn').addEventListener('click', () => setGridMode('row'));

            // 再生/停止ボタン（トグル）
            document.getElementById('playStopBtn').addEventListener('click', toggleAnimation);

            // 録画ボタン（1ループ自動撮影）
            document.getElementById('recordBtn').addEventListener('click', recordOneLoop);

            // フォーカスモードボタン
            document.getElementById('focusModeBtn').addEventListener('click', toggleFocusMode);

            // フォーカススライダー
            document.getElementById('focusSlider').addEventListener('input', onFocusSliderChange);
        }

        // ===== カメラの初期化 =====
        async function initCamera() {
            console.log('カメラを初期化中...');

            // 描画ループをすぐに開始（ビデオ準備前でも）
            requestAnimationFrame(draw);
            console.log('描画ループを開始');

            try {
                // カメラアクセスをリクエスト（アウトカメラを指定）
                const constraints = {
                    video: {
                        facingMode: { exact: 'environment' },  // アウトカメラを指定
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    console.log('アウトカメラ(exact)で取得成功');
                } catch (e) {
                    // exact指定が失敗した場合、preferを試す
                    console.log('exact environment指定が失敗、preferで再試行...', e.message);
                    const fallbackConstraints = {
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    };
                    try {
                        stream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                        console.log('アウトカメラ(prefer)で取得成功');
                    } catch (e2) {
                        // それでも失敗した場合、制約なしで試す
                        console.log('environment指定が失敗、制約なしで再試行...', e2.message);
                        stream = await navigator.mediaDevices.getUserMedia({
                            video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                            audio: false
                        });
                        console.log('制約なしで取得成功');
                    }
                }

                // ビデオトラックを取得
                videoTrack = stream.getVideoTracks()[0];
                console.log('カメラトラック取得:', videoTrack.label);
                console.log('トラック設定:', JSON.stringify(videoTrack.getSettings()));

                // カメラの能力を確認
                checkCameraCapabilities();

                // video要素の属性を確認・設定
                videoElement.setAttribute('autoplay', '');
                videoElement.setAttribute('playsinline', '');
                videoElement.setAttribute('muted', '');
                videoElement.muted = true;  // プログラムでも設定

                // ストリームをvideo要素に接続（属性設定後に行う）
                videoElement.srcObject = stream;
                console.log('ストリームをvideo要素に接続');

                // loadedmetadataイベントを待ってからplay()を呼び出す
                const playVideo = async () => {
                    try {
                        const playPromise = videoElement.play();
                        if (playPromise !== undefined) {
                            await playPromise;
                            console.log('video.play() 成功');
                        }
                    } catch (playError) {
                        console.error('video.play() 失敗:', playError);
                        // play()が失敗した場合、ユーザーインタラクション後に再試行
                        const retryPlay = async () => {
                            try {
                                await videoElement.play();
                                console.log('ユーザークリック後のplay()成功');
                            } catch (e) {
                                console.error('クリック後のplay()も失敗:', e);
                            }
                        };
                        document.body.addEventListener('click', retryPlay, { once: true });
                        document.body.addEventListener('touchstart', retryPlay, { once: true });
                    }
                };

                // loadedmetadataイベントで再生開始
                if (videoElement.readyState >= 1) {
                    // すでにメタデータ読み込み済み
                    console.log('メタデータ読み込み済み、play()を呼び出し');
                    await playVideo();
                } else {
                    videoElement.addEventListener('loadedmetadata', async () => {
                        console.log('loadedmetadata イベント発火');
                        await playVideo();
                    }, { once: true });
                }

                // video要素の状態をポーリングで確認（デバッグ用）
                const checkVideoState = () => {
                    console.log(`ビデオ状態: readyState=${videoElement.readyState}, ` +
                                `size=${videoElement.videoWidth}x${videoElement.videoHeight}, ` +
                                `paused=${videoElement.paused}, ended=${videoElement.ended}, ` +
                                `srcObject=${videoElement.srcObject ? 'あり' : 'なし'}`);
                };

                // 定期的に状態確認
                setTimeout(checkVideoState, 1000);
                setTimeout(checkVideoState, 3000);
                setTimeout(checkVideoState, 5000);

            } catch (error) {
                console.error('カメラの初期化に失敗:', error);
                showError('カメラへのアクセスができませんでした。\nカメラへのアクセスを許可してください。\n\nエラー: ' + error.message);
            }
        }

        // ===== カメラの能力を確認 =====
        function checkCameraCapabilities() {
            if (!videoTrack || typeof videoTrack.getCapabilities !== 'function') {
                console.log('getCapabilities未サポート');
                return;
            }

            const capabilities = videoTrack.getCapabilities();
            console.log('カメラの能力:', capabilities);

            // フォーカス制御のサポートを確認
            if (capabilities.focusMode) {
                focusSupported = true;
                const supportedModes = capabilities.focusMode;
                console.log('サポートされているフォーカスモード:', supportedModes);

                // マニュアルフォーカスのサポートを確認
                mfSupported = supportedModes.includes('manual');

                if (mfSupported && capabilities.focusDistance) {
                    // カメラの能力を取得し、2-100cmの範囲内でクリップ
                    const cameraMin = capabilities.focusDistance.min || 0;
                    const cameraMax = capabilities.focusDistance.max || 2;
                    focusDistanceMin = Math.max(cameraMin, 0.02);  // 最小2cm
                    focusDistanceMax = Math.min(cameraMax, 1.0);   // 最大100cm
                    console.log(`フォーカス距離範囲: ${focusDistanceMin}m - ${focusDistanceMax}m`);

                    // スライダーの範囲を設定（cmに変換）
                    const slider = document.getElementById('focusSlider');
                    slider.min = Math.round(focusDistanceMin * 100);
                    slider.max = Math.round(focusDistanceMax * 100);
                    slider.value = Math.round((focusDistanceMin + focusDistanceMax) / 2 * 100);
                }

                // フォーカスUIを有効化
                document.getElementById('focusModeBtn').disabled = false;
            } else {
                console.log('フォーカス制御は未サポート');
            }
        }

        // ===== エラーメッセージを表示 =====
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // ===== グリッドモードの設定 =====
        function setGridMode(mode) {
            currentMode = mode;
            console.log('グリッドモード変更:', mode);

            // ボタンのアクティブ状態を更新
            document.querySelectorAll('.grid-buttons button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
        }

        // ===== 描画ループ =====
        function draw() {
            const w = canvas.width;
            const h = canvas.height;

            // 背景をクリア
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);

            // カメラ映像がまだ準備できていない場合
            if (!videoElement ||
                videoElement.readyState < videoElement.HAVE_CURRENT_DATA ||
                videoElement.videoWidth === 0 ||
                videoElement.videoHeight === 0) {
                // 待機中のメッセージを表示
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('カメラを準備中...', w / 2, h / 2);

                // グリッドラインは表示
                drawGridLines();

                requestAnimationFrame(draw);
                return;
            }

            const vw = videoElement.videoWidth;
            const vh = videoElement.videoHeight;

            if (isPlaying) {
                // アニメーション再生中: 現在のフレームのみを全画面表示
                drawFullFrame(currentFrame, vw, vh, w, h);
            } else {
                // プレビューモード: カメラ映像全体を表示してグリッドラインを描画
                drawPreview(vw, vh, w, h);
            }

            requestAnimationFrame(draw);
        }

        // ===== プレビュー描画（グリッドライン付き） =====
        function drawPreview(vw, vh, w, h) {
            // カメラ映像のアスペクト比を維持しながら画面全体に表示
            const videoAspect = vw / vh;
            const canvasAspect = w / h;

            let drawWidth, drawHeight, drawX, drawY;

            if (canvasAspect > videoAspect) {
                // キャンバスの方が横長: 幅に合わせる（カバー表示）
                drawWidth = w;
                drawHeight = w / videoAspect;
                drawX = 0;
                drawY = (h - drawHeight) / 2;
            } else {
                // キャンバスの方が縦長: 高さに合わせる（カバー表示）
                drawHeight = h;
                drawWidth = h * videoAspect;
                drawX = (w - drawWidth) / 2;
                drawY = 0;
            }

            // カメラ映像を描画
            ctx.drawImage(videoElement, drawX, drawY, drawWidth, drawHeight);

            // グリッドラインを描画
            drawGridLines();
        }

        // ===== グリッドラインを描画 =====
        function drawGridLines() {
            const w = canvas.width;
            const h = canvas.height;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;

            if (currentMode === 'grid') {
                // 田んぼモード: 縦線と横線
                ctx.beginPath();
                ctx.moveTo(w / 2, 0);
                ctx.lineTo(w / 2, h);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, h / 2);
                ctx.lineTo(w, h / 2);
                ctx.stroke();
            } else if (currentMode === 'column') {
                // タテ短冊モード: 縦線3本
                for (let i = 1; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(w / 4 * i, 0);
                    ctx.lineTo(w / 4 * i, h);
                    ctx.stroke();
                }
            } else if (currentMode === 'row') {
                // ヨコ短冊モード: 横線3本
                for (let i = 1; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, h / 4 * i);
                    ctx.lineTo(w, h / 4 * i);
                    ctx.stroke();
                }
            }
        }

        // ===== フレームを等倍で中央描画 =====
        function drawFullFrame(frameIndex, vw, vh, w, h) {
            // フレームの領域を計算（ソース側）
            let sx, sy, sw, sh;

            if (currentMode === 'grid') {
                // 田んぼモード: 2x2
                const col = frameIndex % 2;
                const row = Math.floor(frameIndex / 2);
                sw = vw / 2;
                sh = vh / 2;
                sx = col * sw;
                sy = row * sh;
            } else if (currentMode === 'column') {
                // タテ短冊モード: 縦4分割
                sw = vw / 4;
                sh = vh;
                sx = frameIndex * sw;
                sy = 0;
            } else if (currentMode === 'row') {
                // ヨコ短冊モード: 横4分割
                sw = vw;
                sh = vh / 4;
                sx = 0;
                sy = frameIndex * sh;
            }

            // 等倍で中央に描画（引き伸ばさない）
            // 背景は既にdraw()でクリア済み（黒）
            const drawX = (w - sw) / 2;
            const drawY = (h - sh) / 2;
            ctx.drawImage(videoElement, sx, sy, sw, sh, drawX, drawY, sw, sh);
        }

        // ===== アニメーション切り替え =====
        function toggleAnimation() {
            if (isPlaying) {
                stopAnimation();
            } else {
                startAnimation();
            }
        }

        // ===== アニメーション開始 =====
        function startAnimation() {
            if (isPlaying) return;

            isPlaying = true;
            currentFrame = 0;
            console.log('アニメーション開始');

            // ボタン状態を更新（停止ボタンに変更）
            const btn = document.getElementById('playStopBtn');
            btn.textContent = '⏹';
            btn.title = '停止';

            // 250msごとにフレームを切り替え（1周1秒）
            animationInterval = setInterval(() => {
                currentFrame = (currentFrame + 1) % 4;
            }, 250);
        }

        // ===== アニメーション停止 =====
        function stopAnimation() {
            if (!isPlaying) return;

            isPlaying = false;
            currentFrame = 0;
            console.log('アニメーション停止');

            // ボタン状態を更新（再生ボタンに変更）
            const btn = document.getElementById('playStopBtn');
            btn.textContent = '▶';
            btn.title = '再生';

            // インターバルをクリア
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
        }

        // ===== 1ループ録画（ボタン押下で自動撮影） =====
        async function recordOneLoop() {
            const recordBtn = document.getElementById('recordBtn');

            // 既に録画中または変換中は無視
            if (isRecording || isConverting) return;

            // MediaRecorderのサポートを確認
            if (!MediaRecorder.isTypeSupported('video/webm')) {
                showError('お使いのブラウザは録画機能をサポートしていません。');
                return;
            }

            console.log('1ループ録画開始');
            isRecording = true;
            recordedChunks = [];

            // ボタンの状態を更新
            recordBtn.classList.add('recording');
            recordBtn.textContent = '撮影中';
            recordBtn.disabled = true;

            // アニメーションを先頭から開始
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
            isPlaying = true;
            currentFrame = 0;

            // 再生ボタンも更新
            const playBtn = document.getElementById('playStopBtn');
            playBtn.textContent = '⏹';
            playBtn.title = '停止';

            // Canvasからストリームを取得
            const canvasStream = canvas.captureStream(30);  // 30fps

            // MediaRecorderを作成
            mediaRecorder = new MediaRecorder(canvasStream, {
                mimeType: 'video/webm;codecs=vp8'
            });

            // データが利用可能になったときの処理
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            // 録画停止時の処理
            mediaRecorder.onstop = () => {
                saveRecording();
            };

            // 録画開始
            mediaRecorder.start();

            // フレームカウント用
            let frameCount = 0;

            // 250msごとにフレームを切り替え（4フレームで1ループ = 1秒）
            animationInterval = setInterval(() => {
                frameCount++;
                if (frameCount >= 4) {
                    // 1ループ完了、録画停止
                    clearInterval(animationInterval);
                    animationInterval = null;

                    // 少し待ってから録画停止（最後のフレームを確実にキャプチャ）
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                        isRecording = false;
                        isPlaying = false;
                        currentFrame = 0;

                        // 再生ボタンを元に戻す
                        playBtn.textContent = '▶';
                        playBtn.title = '再生';
                    }, 100);
                } else {
                    currentFrame = frameCount % 4;
                }
            }, 250);
        }

        // ===== 録画を保存（MP4に変換） =====
        async function saveRecording() {
            if (recordedChunks.length === 0) return;

            const recordBtn = document.getElementById('recordBtn');

            try {
                // WebM Blobを作成
                const webmBlob = new Blob(recordedChunks, { type: 'video/webm' });
                console.log('WebM録画サイズ:', webmBlob.size, 'bytes');

                // MP4に変換を試みる
                recordBtn.textContent = '変換中...';
                isConverting = true;

                const mp4Blob = await convertToMP4(webmBlob);

                if (mp4Blob) {
                    // MP4でダウンロード
                    downloadBlob(mp4Blob, `fretanime_${Date.now()}.mp4`);
                    console.log('MP4で保存完了');
                } else {
                    // 変換失敗時はWebMで保存
                    console.log('MP4変換失敗、WebMで保存');
                    downloadBlob(webmBlob, `fretanime_${Date.now()}.webm`);
                }

            } catch (error) {
                console.error('録画保存エラー:', error);
                // エラー時はWebMで保存
                const webmBlob = new Blob(recordedChunks, { type: 'video/webm' });
                downloadBlob(webmBlob, `fretanime_${Date.now()}.webm`);
            } finally {
                isConverting = false;
                recordBtn.disabled = false;
                recordBtn.classList.remove('recording');
                recordBtn.textContent = '⏺';
            }
        }

        // ===== WebMをMP4に変換 =====
        async function convertToMP4(webmBlob) {
            try {
                // FFmpegがロードされていない場合はロード
                if (!ffmpegLoaded) {
                    console.log('FFmpegをロード中...');

                    // FFmpeg.wasmをロード（シングルスレッド版を使用）
                    const { FFmpeg } = FFmpegWASM;
                    ffmpeg = new FFmpeg();

                    // ログを有効化（デバッグ用）
                    ffmpeg.on('log', ({ message }) => {
                        console.log('FFmpeg:', message);
                    });

                    // シングルスレッド版のコアをロード（SharedArrayBuffer不要）
                    await ffmpeg.load({
                        coreURL: 'https://unpkg.com/@ffmpeg/core-st@0.12.4/dist/umd/ffmpeg-core.js',
                        wasmURL: 'https://unpkg.com/@ffmpeg/core-st@0.12.4/dist/umd/ffmpeg-core.wasm'
                    });

                    ffmpegLoaded = true;
                    console.log('FFmpeg loaded successfully');
                }

                // WebMファイルをFFmpegに書き込み
                const webmData = await webmBlob.arrayBuffer();
                await ffmpeg.writeFile('input.webm', new Uint8Array(webmData));

                // WebM → MP4変換
                await ffmpeg.exec([
                    '-i', 'input.webm',
                    '-c:v', 'libx264',
                    '-preset', 'ultrafast',
                    '-pix_fmt', 'yuv420p',
                    '-movflags', '+faststart',
                    'output.mp4'
                ]);

                // 変換されたMP4を読み取り
                const mp4Data = await ffmpeg.readFile('output.mp4');
                const mp4Blob = new Blob([mp4Data.buffer], { type: 'video/mp4' });

                // クリーンアップ
                await ffmpeg.deleteFile('input.webm');
                await ffmpeg.deleteFile('output.mp4');

                return mp4Blob;

            } catch (error) {
                console.error('MP4変換エラー:', error);
                return null;
            }
        }

        // ===== Blobをダウンロード =====
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            console.log('ファイル保存:', filename);
        }

        // ===== フォーカスモードの切り替え =====
        async function toggleFocusMode() {
            if (!focusSupported) return;

            const btn = document.getElementById('focusModeBtn');
            const slider = document.getElementById('focusSlider');
            const valueDisplay = document.getElementById('focusValue');

            if (focusMode === 'continuous') {
                // MFモードに切り替え
                if (!mfSupported) {
                    console.log('マニュアルフォーカスは未サポート');
                    return;
                }

                focusMode = 'manual';
                btn.textContent = 'MF';
                btn.classList.add('active');
                slider.disabled = false;

                // 現在のスライダー値でフォーカスを設定
                const distance = slider.value / 100;  // cmをmに変換
                await setFocusDistance(distance);
                valueDisplay.textContent = `${slider.value}cm`;

                console.log('マニュアルフォーカスモードに切り替え');
            } else {
                // AFモードに切り替え
                focusMode = 'continuous';
                btn.textContent = 'AF';
                btn.classList.remove('active');
                slider.disabled = true;
                valueDisplay.textContent = 'AUTO';

                await setAutoFocus();
                console.log('オートフォーカスモードに切り替え');
            }
        }

        // ===== フォーカススライダーの変更 =====
        async function onFocusSliderChange(event) {
            if (focusMode !== 'manual') return;

            const value = event.target.value;
            const distance = value / 100;  // cmをmに変換

            document.getElementById('focusValue').textContent = `${value}cm`;
            await setFocusDistance(distance);
        }

        // ===== オートフォーカスを設定 =====
        async function setAutoFocus() {
            if (!videoTrack) return;

            try {
                await videoTrack.applyConstraints({
                    advanced: [{ focusMode: 'continuous' }]
                });
                console.log('オートフォーカスを設定しました');
            } catch (error) {
                console.error('オートフォーカスの設定に失敗:', error);
            }
        }

        // ===== フォーカス距離を設定 =====
        async function setFocusDistance(distance) {
            if (!videoTrack) return;

            try {
                await videoTrack.applyConstraints({
                    advanced: [{
                        focusMode: 'manual',
                        focusDistance: distance
                    }]
                });
                console.log(`フォーカス距離を設定: ${distance}m`);
            } catch (error) {
                console.error('フォーカス距離の設定に失敗:', error);
            }
        }
    </script>
</body>
